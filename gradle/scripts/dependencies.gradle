apply from: 'gradle/scripts/helpers.gradle'

repositories {
    flatDir {
        dirs('libs') // /libs
    }
    maven {
        name = 'CleanroomMC'
        url = 'https://maven.cleanroommc.com'
        content {
            includeGroup 'mezz'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
        content {
            includeGroupByRegex 'com\\.github\\..*'
        }
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    implementation "com.cleanroommc:cleanmix:0.7.4"

    modCompileOnly "curse.maven:mouse-tweaks-unofficial-461660:5876158"
    modCompileOnly "curse.maven:thaumic-jei-285492:5646810"

    modRuntimeOnly "curse.maven:fugue-1005815:8403977"
    modRuntimeOnly "curse.maven:scalar-legacy-1235372:6842491"
    modRuntimeOnly "curse.maven:thaumic-augmentation-319441:5129455"

    modImplementation "com.github.FormlessDragon:Applied-Energistics-2-Supergiant:v${ae2_version}:dev"

    modImplementation 'curse.maven:baubles-227083:2518667'
    modImplementation 'curse.maven:thaumcraft-223628:2629023'
    modImplementation 'mezz:jei:4.35.0'
}

if (propertyBool('enable_shadow')) {
    tasks.named("shadowJar").configure {
        // Exclude specific parts of deps to keep your jar clean
        // dependencies {
        //     exclude 'META-INF/maven/**'
        // }

        // Relocate specific parts of deps, so multiple shaded classes in mods will not conflict
        // relocate "mezz.jei", "shaded.mezz.jei"

        // Remove unused classes automatically. May cause issues if they are accessed by reflection
        // minimize()
    }
}
